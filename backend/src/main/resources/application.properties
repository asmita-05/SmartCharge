# ==========================================
# SmartCharge Backend Configuration
# ==========================================

# Application
spring.application.name=SmartCharge

# Server
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# Configure SMARTCHARGE_JWT_SECRET (at least 32 UTF-8 bytes) for a stable key across restarts/instances.
smartcharge.auth.jwt-secret=${SMARTCHARGE_JWT_SECRET}

# OpenRouteService routing (provide ORS_API_KEY as a server environment variable)
smartcharge.routing.ors-base-url=${ORS_BASE_URL:https://api.heigit.org/openrouteservice/v2}
smartcharge.routing.ors-api-key=${ORS_API_KEY:}

# Brevo transactional email (OTP signup verification)
smartcharge.brevo.api-key=${BREVO_API_KEY:}
smartcharge.brevo.sender-email=${BREVO_SENDER_EMAIL:}
smartcharge.brevo.sender-name=${BREVO_SENDER_NAME:SmartCharge}

# Local zero-shot NLP service (runs on the same computer as this backend)
smartcharge.nlp.base-url=${SMARTCHARGE_NLP_URL:http://127.0.0.1:8090}
smartcharge.nlp.request-timeout-seconds=${SMARTCHARGE_NLP_TIMEOUT_SECONDS:45}

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/smartcharge
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Database Initialization
spring.sql.init.mode=never

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
