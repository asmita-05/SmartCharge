<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCharge - Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 12px;
            background: #7c3aed;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .logo h1 {
            font-size: 28px;
            color: #1e293b;
        }

        .logo p {
            margin-top: 6px;
            color: #64748b;
            font-size: 14px;
        }

        .admin-badge {
            text-align: center;
            margin-bottom: 25px;
            color: #7c3aed;
            font-weight: 700;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #7c3aed;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #7c3aed;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #6d28d9;
        }

        .login-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #b91c1c;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        <div class="logo-icon">⚡</div>

        <h1>SmartCharge</h1>

        <p>
            EV Charging Station Management System
        </p>
    </div>

    <div class="admin-badge">
        Administrator Portal
    </div>

    <form id="loginForm">

        <div class="form-group">

            <label for="email">
                Admin Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                required
            >

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter admin password"
                required
            >

        </div>

        <button
            type="submit"
            class="login-btn"
            id="loginButton"
        >
            Login
        </button>

    </form>

    <div id="message" class="message"></div>

    <a
        href="../index.html"
        class="back-link"
    >
        ← Back to Home
    </a>

</div>

<script>

    const API_BASE_URL =
        ((location.protocol === "file:") ? "http://localhost:8080/api" : "/api");


    const loginForm =
        document.getElementById(
            "loginForm"
        );

    const loginButton =
        document.getElementById(
            "loginButton"
        );

    const message =
        document.getElementById(
            "message"
        );


    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            if (!email || !password) {

                showMessage(
                    "Please enter email and password.",
                    "error"
                );

                return;
            }


            loginButton.disabled = true;
            loginButton.textContent =
                "Logging in...";


            try {

                const response =
                    await fetch(
                        `${API_BASE_URL}/users/login`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Invalid email or password."
                    );
                }


                const user =
                    await response.json();


                if (
                    user.role &&
                    user.role.toUpperCase() !==
                    "ADMIN"
                ) {

                    throw new Error(
                        "This account does not have administrator access."
                    );
                }


                localStorage.setItem(
                    "smartchargeAdmin",
                    JSON.stringify(user)
                );


                showMessage(
                    "Login successful. Redirecting...",
                    "success"
                );


                setTimeout(
                    () => {

                        window.location.href =
                            "dashboard.html";

                    },
                    700
                );


            } catch (error) {

                showMessage(
                    error.message ||
                    "Unable to connect to the server.",
                    "error"
                );

            } finally {

                loginButton.disabled = false;
                loginButton.textContent =
                    "Login";
            }

        }
    );


    function showMessage(
        text,
        type
    ) {

        message.textContent =
            text;

        message.className =
            "message " + type;
    }

</script>

</body>
</html>
